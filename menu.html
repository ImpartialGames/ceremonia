<style>
:root{--navy:#12223d;--navy-lt:#172642;--cream:#EDE8DF;--gold:#f0e3d7;--ivory:#F5F0E8;--umber:#8B6F47;--ease:cubic-bezier(0.16,1,0.3,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{background:var(--navy);overflow-x:clip;font-family:'Poppins',sans-serif;color:var(--ivory)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--gold)}
a{text-decoration:none;color:inherit}
.grain::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.05}

/* ── chooser ── */
#choose{position:relative;min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:150px 7vw 90px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,rgba(139,94,60,.14) 0%,transparent 62%)}
#choose .eyebrow{font-size:10px;letter-spacing:.55em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
#choose h1{font-family:'Poppins',sans-serif;font-weight:500;font-size:clamp(48px,9vw,104px);line-height:.92;letter-spacing:-.01em}
#choose h1 em{display:block;color:var(--gold);font-weight:400;font-style:italic}
#choose .tag{max-width:520px;margin:26px auto 0;font-weight:300;font-size:13px;line-height:1.9;color:rgba(245,240,232,.55)}
.cover-orn{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:30px}
.cover-orn .l{width:60px;height:1px;background:rgba(240,227,215,.3)}
.cover-orn span{color:rgba(240,227,215,.6);font-size:13px}
.menu-choice{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;max-width:860px;margin-top:52px}
.mbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:44px 20px;
  border:1px solid rgba(240,227,215,.25);border-radius:15px;background:linear-gradient(160deg,rgba(23,38,66,.65),rgba(18,34,61,.9));
  cursor:pointer;transition:border-color .35s var(--ease),transform .35s var(--ease),box-shadow .35s var(--ease)}
.mbtn:hover{border-color:var(--gold);transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,0,0,.4)}
.mbtn .mb-orn{color:rgba(240,227,215,.6);font-size:14px;transition:color .35s}
.mbtn:hover .mb-orn{color:var(--gold)}
.mbtn .mb-title{font-family:'Poppins',sans-serif;font-weight:500;font-size:clamp(23px,2.6vw,30px);line-height:1.15;color:var(--ivory)}
.mbtn .mb-hint{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(240,227,215,.55)}
@media(max-width:760px){.menu-choice{grid-template-columns:1fr;gap:12px;margin-top:40px}.mbtn{padding:30px 20px;gap:10px}#choose{padding:130px 7vw 70px}}

/* ── footer ── */
footer{text-align:center;padding:48px 7vw 60px;background:var(--navy);position:relative}
footer .logo{width:84px;margin:0 auto 14px}
footer .tagline{font-family:'Poppins',sans-serif;font-style:italic;color:var(--gold);font-size:18px}
footer .home{display:inline-block;margin-top:26px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);padding:12px 28px;border-radius:6px;transition:background .3s,color .3s}
footer .home:hover{background:var(--gold);color:var(--navy)}

/* ── card overlay ── */
#card{position:fixed;inset:0;z-index:300;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:rgba(11,21,36,.78);backdrop-filter:blur(7px)}
#card.open{display:block}
.card-close{position:fixed;top:16px;right:18px;z-index:320;width:42px;height:42px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;
  color:var(--gold);background:rgba(18,34,61,.85);border:1px solid rgba(240,227,215,.4);backdrop-filter:blur(8px);
  transition:background .3s,color .3s}
.card-close:hover{background:var(--gold);color:var(--navy)}
.page-stack{position:relative;max-width:760px;margin:34px auto 70px;padding:0 12px;display:flex;flex-direction:column;gap:16px;
  animation:sheetIn .5s var(--ease)}
@keyframes sheetIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.page-stack img{width:100%;display:block;border-radius:6px;box-shadow:0 24px 70px rgba(0,0,0,.55);background:var(--cream)}
.stack-foot{text-align:center;padding:10px 0 4px}
.stack-foot a{display:inline-block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);
  padding:12px 28px;border-radius:6px;transition:background .3s,color .3s}
.stack-foot a:hover{background:var(--gold);color:var(--navy)}
@media(max-width:760px){
  .page-stack{margin:64px auto 50px;padding:0 8px;gap:10px}
  .card-close{top:12px;right:12px}
}

<body>
<script src="nav.js"></script>

<div id="choose-wrap">
<header id="choose" class="grain">
  <p class="eyebrow" data-t="The Menu">The Menu</p>
  <h1>Ceremonia<em>Menu</em></h1>
  <p class="tag" data-t="Choose your menu">Choose your menu</p>
  <div class="menu-choice">
    <a class="mbtn" href="#breakfast-coffee" data-open="breakfast-coffee">
      <span class="mb-orn">✦</span>
      <span class="mb-title" data-t="Breakfast &amp; Coffee">Breakfast &amp; Coffee</span>
      <span class="mb-hint" data-t="View the menu">View the menu</span>
    </a>
    <a class="mbtn" href="#food" data-open="food">
      <span class="mb-orn">✦</span>
      <span class="mb-title" data-t="Food">Food</span>
      <span class="mb-hint" data-t="View the menu">View the menu</span>
    </a>
    <a class="mbtn" href="#drinks" data-open="drinks">
      <span class="mb-orn">✦</span>
      <span class="mb-title" data-t="Drinks">Drinks</span>
      <span class="mb-hint" data-t="View the menu">View the menu</span>
    </a>
  </div>
  <div class="cover-orn"><span class="l"></span><span>✦</span><span class="l"></span></div>
</header>

<footer class="grain">
  <img class="logo" src="logo-ceremonia-beige.webp" alt="Ceremonia">
  <p class="tagline" data-t="Under the Ubud Sky">Under the Ubud Sky</p>
  <a class="home" href="/" data-t="Back to Ceremonia">Back to Ceremonia</a>
  <p style="margin-top:14px"><a href="/privacy" data-t="Privacy &amp; Legal Notice" style="font-size:10px;letter-spacing:.14em;color:rgba(245,240,232,.35);text-decoration:underline;text-underline-offset:3px">Privacy &amp; Legal Notice</a></p>
</footer>
</div>

<div id="card" role="dialog" aria-modal="true" aria-label="Menu"></div>

<script src="menu-i18n.js"></script>
<script>
const MENUS={
  'breakfast-coffee':{label:'Breakfast & Coffee', slug:'breakfast', pages:5, pdf:'BREAKFAST.pdf'},
  'food':{label:'Food', slug:'food', pages:7, pdf:'FOOD.pdf'},
  'drinks':{label:'Drinks', slug:'drinks', pages:7, pdf:'DRINKS.pdf'},
};

function cardHTML(key){
  const M=MENUS[key];
  const imgs=Array.from({length:M.pages},(_,i)=>{
    const n=String(i+1).padStart(2,'0');
    return `<img src="menu-pages/${M.slug}-${n}.webp" alt="Ceremonia ${M.label} menu, page ${i+1}"${i>0?' loading="lazy"':''} decoding="async">`;
  }).join('');
  return `<div class="page-stack">
    ${imgs}
    <div class="stack-foot"><a href="${M.pdf}" target="_blank" rel="noopener" data-dl>${t('Download the menu (PDF)')}</a></div>
  </div>`;
}

const overlay=document.getElementById('card');
let openKey=null, openedInPage=false;
function openCard(key){
  if(!MENUS[key])return;
  openKey=key;
  overlay.innerHTML=`<button class="card-close" aria-label="Close">✕</button>`+cardHTML(key);
  overlay.querySelector('.card-close').addEventListener('click',requestClose);
  overlay.scrollTop=0;
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeCard(){
  if(!openKey)return;
  openKey=null;
  overlay.classList.remove('open');
  document.body.style.overflow='';
}
function requestClose(){
  if(openedInPage){history.back();}
  else{closeCard();history.replaceState(null,'',location.pathname);}
}
function syncFromHash(){
  const k=location.hash.replace('#','');
  if(MENUS[k])openCard(k);else closeCard();
}
document.querySelectorAll('[data-open]').forEach(a=>a.addEventListener('click',()=>{openedInPage=true;}));
window.addEventListener('hashchange',syncFromHash);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openKey)requestClose();});

window.__render=function(){
  if(openKey){
    const dl=overlay.querySelector('[data-dl]');
    if(dl)dl.textContent=t('Download the menu (PDF)');
  }
};

const q=new URLSearchParams(location.search).get('open');
if(q&&MENUS[q]){history.replaceState(null,'',location.pathname+'#'+q);}
syncFromHash();
if(window.initI18n)initI18n();
</script>
</body>
</html>
