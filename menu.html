*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{background:var(--navy);overflow-x:clip;font-family:'Inter',sans-serif;color:var(--ivory)}

/* ── chooser ── */
#choose{position:relative;min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:150px 7vw 90px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,rgba(139,94,60,.14) 0%,transparent 62%)}
#choose .eyebrow{font-size:10px;letter-spacing:.55em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
#choose h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(48px,9vw,104px);line-height:.92;letter-spacing:-.01em}
#choose h1 em{display:block;color:var(--gold);font-weight:400;font-style:italic}
#choose .tag{max-width:520px;margin:26px auto 0;font-weight:300;font-size:13px;line-height:1.9;color:rgba(245,240,232,.55)}
.cover-orn{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:30px}
.cover-orn .l{width:60px;height:1px;background:rgba(212,184,150,.3)}
.cover-orn span{color:rgba(212,184,150,.6);font-size:13px}
.menu-choice{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;max-width:860px;margin-top:52px}
.mbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:44px 20px;
  border:1px solid rgba(212,184,150,.25);border-radius:15px;background:linear-gradient(160deg,rgba(20,31,58,.65),rgba(15,27,53,.9));
  cursor:pointer;transition:border-color .35s var(--ease),transform .35s var(--ease),box-shadow .35s var(--ease)}
.mbtn:hover{border-color:var(--gold);transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,0,0,.4)}
.mbtn .mb-orn{color:rgba(212,184,150,.6);font-size:14px;transition:color .35s}
.mbtn:hover .mb-orn{color:var(--gold)}
.mbtn .mb-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(23px,2.6vw,30px);line-height:1.15;color:var(--ivory)}
.mbtn .mb-hint{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(212,184,150,.55)}
@media(max-width:760px){.menu-choice{grid-template-columns:1fr;gap:12px;margin-top:40px}.mbtn{padding:30px 20px;gap:10px}#choose{padding:130px 7vw 70px}}

/* ── footer ── */
footer{text-align:center;padding:48px 7vw 60px;background:var(--navy);position:relative}
footer .logo{width:84px;margin:0 auto 14px}
footer .tagline{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:18px}
footer .home{display:inline-block;margin-top:26px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);padding:12px 28px;transition:background .3s,color .3s}
footer .home:hover{background:var(--gold);color:var(--navy)}

/* ── card overlay ── */
#card{position:fixed;inset:0;z-index:300;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:rgba(8,14,28,.78);backdrop-filter:blur(7px)}
#card.open{display:block}
.card-close{position:fixed;top:16px;right:18px;z-index:320;width:42px;height:42px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;
  color:var(--gold);background:rgba(15,27,53,.85);border:1px solid rgba(212,184,150,.4);backdrop-filter:blur(8px);
  transition:background .3s,color .3s}
.card-close:hover{background:var(--gold);color:var(--navy)}
.sheet{position:relative;max-width:720px;margin:34px auto 70px;background:var(--cream);color:var(--navy);
  border-radius:6px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:sheetIn .5s var(--ease)}
@keyframes sheetIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.sheet-head{position:relative;background:var(--navy);text-align:center;padding:32px 20px 28px}
.sheet-head img{width:72px;display:block;margin:0 auto 10px}
.sheet-head .wm{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:var(--ivory)}
.sheet-head .loc{margin-top:7px;font-size:8.5px;letter-spacing:.34em;text-transform:uppercase;color:rgba(212,184,150,.75)}
.sheet-title{text-align:center;padding:34px 26px 4px}
.sheet-title .eyebrow{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:var(--umber);margin-bottom:14px}
.sheet-title h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(34px,6vw,50px);line-height:1;color:var(--navy)}

.sheet-title .slegend{margin-top:12px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--umber)}
.sheet-title .orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px auto 0;max-width:280px}
.sheet-title .orn .l{flex:1;height:1px;background:rgba(139,111,71,.3)}
.sheet-title .orn span{color:var(--umber);font-size:12px}
.chips{position:sticky;top:0;z-index:6;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:13px 20px;background:rgba(237,232,223,.93);backdrop-filter:blur(10px);border-bottom:1px solid rgba(15,27,53,.08)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(15,27,53,.6);background:transparent;border:1px solid rgba(15,27,53,.22);border-radius:30px;padding:8px 15px;cursor:pointer;

.chip:hover{color:var(--navy);border-color:rgba(15,27,53,.5)}
.chip.active{background:var(--navy);color:var(--gold);border-color:var(--navy);font-weight:600}
.pgroup{padding:34px 38px 6px}
.pgroup:last-of-type{padding-bottom:26px}
.pg-head{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.pg-head .l{flex:1;height:1px;background:rgba(139,111,71,.25)}

.pg-note{text-align:center;font-size:11.5px;font-weight:300;font-style:italic;color:rgba(15,27,53,.55);margin:2px 0 6px}
.psec{margin:24px 0 6px}
.psec-label{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.psec-label span{font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--umber);white-space:nowrap}
.psec-label .l{flex:1;height:1px;background:rgba(15,27,53,.1)}
.psec-note{font-size:11px;font-weight:300;font-style:italic;color:rgba(15,27,53,.5);margin:0 0 10px}
.row{padding:9px 0;border-bottom:1px solid rgba(15,27,53,.045)}

.row .rt{display:flex;align-items:baseline;gap:10px}
.row .nm{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:19px;color:var(--navy)}
.leader{flex:1;min-width:26px;border-bottom:1px dotted rgba(15,27,53,.28);transform:translateY(-4px)}
.pr{font-size:12px;letter-spacing:.05em;color:var(--umber);font-weight:600;white-space:nowrap}

.pbtl{font-size:11px;font-weight:300;color:rgba(15,27,53,.55);margin-top:6px;letter-spacing:.03em}
.pbtl b{color:var(--umber);font-weight:600}
.pbadge{display:inline-block;font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);background:var(--navy);border-radius:20px;padding:2px 8px;margin-left:8px;vertical-align:middle;font-weight:600}

.pextras li b{color:var(--umber);font-weight:600;white-space:nowrap}
.sheet-foot{text-align:center;padding:26px 34px 38px;border-top:1px solid rgba(15,27,53,.07);margin-top:22px}
.sheet-foot .note{font-size:10.5px;font-weight:300;line-height:1.8;color:rgba(15,27,53,.5);max-width:460px;margin:0 auto 18px}
.sheet-foot .orn{color:var(--umber);font-size:12px}
.sheet-foot .tagline{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--umber);font-size:16px;margin-top:10px}
@media(max-width:760px){
  .sheet{margin:0;max-width:none;min-height:100%;border-radius:0}
  .pgroup{padding:28px 22px 4px}
  .row .nm{font-size:18px}
  .card-close{top:12px;right:12px}
}
</style>

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function itemRow(it){
  const veg = it.veg ? `<span class="pveg">(${esc(it.veg===true?'V':t(it.veg))})</span>` : '';
  const badge = it.tag ? `<span class="pbadge">${esc(t(it.tag))}</span>` : '';
  const price = it.glass!=null
    ? `<span class="pr">${esc(it.glass)}<small>k</small><span class="pl">glass</span></span>`
    : (it.price!=null?`<span class="pr">${esc(it.price)}<small>k</small></span>`:'');
  return `<div class="row">
    <div class="rt"><span class="nm">${esc(it.name)}${veg}${badge}</span><span class="leader"></span>${price}</div>
    ${it.sub?`<p class="psub">${esc(t(it.sub))}</p>`:''}
    ${it.desc?`<p class="rd">${esc(t(it.desc))}</p>`:''}
    ${it.bottle!=null?`<p class="pbtl">Bottle 750ml · <b>${esc(it.bottle)}k</b></p>`:''}
  </div>`;
}
function sectionHTML(sec){
  const body = sec.extras
    ? `<ul class="pextras">${sec.extras.map(e=>`<li><span>${esc(t(e[0]))}</span><span class="leader"></span><b>${esc(e[1])}k</b></li>`).join('')}</ul>`
    : sec.items.map(itemRow).join('');
  return `<div class="psec">
    <div class="psec-label"><span>${esc(t(sec.label))}</span><span class="l"></span></div>
    ${sec.note?`<p class="psec-note">${esc(t(sec.note))}</p>`:''}
    ${body}
  </div>`;
}
function cardHTML(key){
  const M=MENUS[key];
  return `<div class="sheet grain">
    <div class="sheet-head">
      <img src="logo-ceremonia-beige.webp" alt="Ceremonia">
      <p class="wm">Ceremonia</p>
      <p class="loc">Rooftop · Ubud · Bali</p>
    </div>
    <div class="sheet-title">
      <p class="eyebrow">${esc(t(M.eyebrow))}</p>
      <h2>${esc(t(M.label))}</h2>
      ${M.tag&&M.tag.length?`<p class="stag">${M.tag.map(s=>esc(t(s))).join('<br>')}</p>`:''}
      ${M.legend?`<p class="slegend">${esc(t(M.legend))}</p>`:''}
      <div class="orn"><span class="l"></span><span>✦</span><span class="l"></span></div>
    </div>
    <nav class="chips">${M.MENU.map((g,gi)=>`<button class="chip${gi===0?' active':''}" data-g="${gi}">${esc(t(g.group))}</button>`).join('')}</nav>
    ${M.MENU.map((g,gi)=>`<section class="pgroup" id="pg-${gi}">
      <div class="pg-head"><span class="l"></span><h3>${esc(t(g.group))}</h3><span class="l"></span></div>
      ${g.note?`<p class="pg-note">${esc(t(g.note))}</p>`:''}
      ${g.sections.map(sectionHTML).join('')}
    </section>`).join('')}
    <div class="sheet-foot">
      <p class="note">${esc(t(M.NOTE))}</p>
      <span class="orn">✦</span>
      <p class="tagline">${esc(t("Under the Ubud Sky"))}</p>
    </div>
  </div>`;
}

const overlay=document.getElementById('card');
let openKey=null, openedInPage=false, spy=null;
function bindCard(){
  overlay.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
    const g=overlay.querySelector('#pg-'+b.dataset.g);
    if(g){const top=g.offsetTop-58;overlay.scrollTo({top:Math.max(0,top),behavior:'smooth'})}
  }));
  if(spy)spy.disconnect();
  spy=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        const gi=e.target.id.replace('pg-','');
        overlay.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.g===gi));
      }
    });
  },{root:overlay,rootMargin:'-25% 0px -65% 0px'});
  overlay.querySelectorAll('.pgroup').forEach(g=>spy.observe(g));
  overlay.querySelector('.card-close').addEventListener('click',requestClose);
}
function openCard(key){
  if(!MENUS[key])return;
  openKey=key;
  overlay.innerHTML=`<button class="card-close" aria-label="Close">✕</button>`+cardHTML(key);
  bindCard();
  overlay.scrollTop=0;
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeCard(){
  if(!openKey)return;
  openKey=null;
  overlay.classList.remove('open');
  document.body.style.overflow='';
}
function requestClose(){
  if(openedInPage){history.back();}
  else{closeCard();history.replaceState(null,'',location.pathname);}
}
function syncFromHash(){
  const k=location.hash.replace('#','');
  if(MENUS[k])openCard(k);else closeCard();
}
document.querySelectorAll('[data-open]').forEach(a=>a.addEventListener('click',()=>{openedInPage=true;}));
window.addEventListener('hashchange',syncFromHash);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openKey)requestClose();});

window.__render=function(){
  if(openKey){
    const st=overlay.scrollTop;
    overlay.innerHTML=`<button class="card-close" aria-label="Close">✕</button>`+cardHTML(openKey);
    bindCard();
    overlay.scrollTop=st;
  }
};

const q=new URLSearchParams(location.search).get('open');
if(q&&MENUS[q]){history.replaceState(null,'',location.pathname+'#'+q);}
syncFromHash();
if(window.initI18n)initI18n();
</script>
