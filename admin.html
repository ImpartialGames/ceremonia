<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reservations · Ceremonia Team</title>
<meta name="theme-color" content="#12223d">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--navy:#12223d;--navy-lt:#172642;--gold:#f0e3d7;--ivory:#F5F0E8;--green:#8FCB9B;--blue:#9BB8E8;--red:#E2A9A0;--amber:#E89678;--ease:cubic-bezier(0.16,1,0.3,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);font-family:'Poppins',sans-serif;color:var(--ivory);min-height:100vh}
a{color:var(--gold);text-decoration:none}
button{font-family:'Poppins',sans-serif;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 90px}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:26px}
header.bar .brand{display:flex;align-items:center;gap:10px}
header.bar img{width:34px}
header.bar h1{font-family:'Poppins',sans-serif;font-weight:500;font-size:26px}
.pill{font-size:10px;letter-spacing:.18em;text-transform:uppercase;border:1px solid rgba(240,227,215,.5);color:var(--gold);
  background:none;padding:9px 18px;border-radius:30px;transition:all .25s}
.pill:hover{background:var(--gold);color:var(--navy)}
.pill.solid{background:var(--gold);color:var(--navy);font-weight:600}
.pill.solid:hover{background:transparent;color:var(--gold)}

/* login */
#login{max-width:360px;margin:12vh auto 0;text-align:center}
#login img{width:72px;margin-bottom:16px}
#login h1{font-family:'Poppins',sans-serif;font-weight:500;font-size:30px;margin-bottom:6px}
#login p{font-size:12px;font-weight:300;color:rgba(245,240,232,.5);margin-bottom:26px}
#login input{width:100%;background:rgba(14,25,46,.6);border:1px solid rgba(240,227,215,.25);border-radius:9px;color:var(--ivory);
  font-size:14px;font-weight:300;padding:13px 14px;margin-bottom:12px;outline:none;font-family:'Poppins',sans-serif}
#login input:focus{border-color:var(--gold)}
#login .pill{width:100%;padding:13px}
#login-err{display:none;color:var(--red);font-size:12px;margin-top:12px}
#app{display:none}

/* requests banner */
#req-box{border:1px solid rgba(232,199,125,.45);border-radius:14px;background:linear-gradient(160deg,rgba(43,36,24,.55),rgba(18,34,61,.9));
  padding:18px 18px 8px;margin-bottom:30px}
#req-box.quiet{border-color:rgba(240,227,215,.18);background:none;padding:14px 18px}
#req-box h2{font-family:'Poppins',sans-serif;font-weight:500;font-size:21px;color:#E8C77D;margin-bottom:4px;display:flex;gap:10px;align-items:center}
#req-box .sub{font-size:11px;font-weight:300;color:rgba(245,240,232,.5);margin-bottom:14px}
#req-box.quiet h2{color:rgba(245,240,232,.5);font-size:16px;margin:0}
.count-dot{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:12px;
  background:#E8C77D;color:var(--navy);font-family:'Poppins',sans-serif;font-size:12px;font-weight:700}

/* view switch */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;align-items:center}
.tab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(240,227,215,.4);color:rgba(245,240,232,.6);
  background:none;padding:10px 22px;border-radius:30px;transition:all .25s}
.tab:hover{color:var(--gold);border-color:var(--gold)}
.tab.on{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:600}

/* day header */
#dayhead{display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
#dayhead.show{display:flex}
#dayhead .dh-l{display:flex;align-items:center;gap:10px}
#dayhead h2{font-family:'Poppins',sans-serif;font-weight:500;font-size:26px;color:var(--ivory);min-width:150px;text-align:center}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid rgba(240,227,215,.4);background:none;color:var(--gold);font-size:16px}
.arrow:hover{background:var(--gold);color:var(--navy)}
#dayhead input[type=date]{background:rgba(14,25,46,.6);border:1px solid rgba(240,227,215,.25);border-radius:9px;color:var(--ivory);
  padding:8px 10px;font-family:'Poppins',sans-serif;font-size:12px;color-scheme:dark;outline:none;cursor:pointer}
#summary{font-size:12px;font-weight:300;color:rgba(245,240,232,.55);margin:0 0 18px;min-height:16px}
#summary b{color:var(--gold);font-weight:600}
.datehdr{font-family:'Poppins',sans-serif;font-size:19px;font-weight:500;color:rgba(240,227,215,.85);margin:26px 0 10px;
  border-bottom:1px solid rgba(240,227,215,.15);padding-bottom:6px}

/* cards */
.card{border:1px solid rgba(240,227,215,.2);border-radius:14px;background:linear-gradient(160deg,rgba(23,38,66,.6),rgba(18,34,61,.85));
  padding:16px;margin-bottom:12px}
.card.late{border-color:rgba(232,150,120,.7)}
.card.dim{opacity:.45}
.c-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.c-top .time{font-family:'Poppins',sans-serif;font-size:26px;font-weight:500;color:var(--gold)}
.c-top .nm{font-size:15px;font-weight:600}
.c-top .pax{font-size:12px;color:rgba(245,240,232,.65);white-space:nowrap}
.c-top .when{font-size:11px;color:rgba(245,240,232,.45)}
.chip{margin-left:auto;font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:20px;border:1px solid;white-space:nowrap}
.chip.pending{color:#E8C77D;border-color:rgba(232,199,125,.5)}
.chip.confirmed{color:var(--green);border-color:rgba(143,203,155,.5)}
.chip.seated{color:var(--blue);border-color:rgba(155,184,232,.5)}
.chip.completed{color:var(--gold);border-color:rgba(240,227,215,.6)}
.chip.cancelled{color:var(--red);border-color:rgba(226,169,160,.4)}
.chip.no_show{color:rgba(245,240,232,.4);border-color:rgba(245,240,232,.25)}
.chip.late{color:var(--amber);border-color:rgba(232,150,120,.6)}
.c-ct{font-size:11px;font-weight:300;color:rgba(245,240,232,.5);margin-top:6px;word-break:break-all}
.c-nt{font-size:12px;font-weight:300;color:rgba(240,227,215,.8);margin-top:6px;font-style:italic}
.c-bill{font-size:12px;color:var(--gold);margin-top:8px}

/* assignment fields */
.c-assign{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.af{display:flex;flex-direction:column;gap:4px}
.af label{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(240,227,215,.6)}
.af input{background:rgba(14,25,46,.7);border:1px solid rgba(240,227,215,.3);border-radius:9px;color:var(--ivory);
  font-family:'Poppins',sans-serif;font-size:13px;padding:9px 12px;outline:none}
.af input:focus{border-color:var(--gold)}
.af input.tbl{width:92px}
.af input.tbl.conflict{border-color:var(--amber);color:var(--amber)}
.af input.srv{width:130px}

/* action buttons */
.c-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.act{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:12px 20px;border-radius:30px;border:1px solid;transition:all .25s}
.act.ok{background:var(--green);border-color:var(--green);color:var(--navy)}
.act.ok:hover{background:transparent;color:var(--green)}
.act.main{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.act.main:hover{background:transparent;color:var(--gold)}
.act.no{background:none;border-color:rgba(226,169,160,.5);color:var(--red)}
.act.no:hover{background:var(--red);color:var(--navy)}
.act.wa{background:none;border-color:rgba(143,203,155,.5);color:var(--green);display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.act.wa:hover{background:var(--green);color:var(--navy)}
.fixlink{font-size:10px;color:rgba(245,240,232,.35);text-decoration:underline;text-underline-offset:3px;background:none;border:none;margin-left:auto}
.fixlink:hover{color:var(--gold)}
.fixrow{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(240,227,215,.2);align-items:center;gap:10px;flex-wrap:wrap}
.fixrow.show{display:flex}
.fixrow span{font-size:10px;color:rgba(245,240,232,.45);letter-spacing:.1em;text-transform:uppercase}
.rbtn{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;border-radius:999px;
  border:1px solid rgba(240,227,215,.4);background:none;color:var(--gold);transition:all .2s}
.rbtn:hover{background:var(--gold);color:var(--navy)}
select.st{background:rgba(14,25,46,.7);border:1px solid rgba(240,227,215,.3);border-radius:20px;color:var(--ivory);
  font-family:'Poppins',sans-serif;font-size:11px;padding:8px 12px;outline:none}

.empty{font-size:13px;font-weight:300;color:rgba(245,240,232,.4);padding:22px 6px;text-align:center;line-height:1.8}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--navy);font-size:12px;font-weight:600;
  padding:11px 24px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center;z-index:50}
#toast.on{opacity:1}
#toast.warn{background:var(--amber)}
@media(max-width:560px){.c-top .time{font-size:22px}.act{width:100%;text-align:center;justify-content:center}.fixlink{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">

  <div id="login">
    <img src="logo-ceremonia-beige.webp" alt="Ceremonia">
    <h1>Team Access</h1>
    <p>Reservations back office. Staff only.</p>
    <form id="login-form">
      <input id="l-email" type="email" placeholder="Email" required autocomplete="username">
      <input id="l-pass" type="password" placeholder="Password" required autocomplete="current-password">
      <button class="pill solid" type="submit">Sign in</button>
      <p id="login-err">Wrong email or password.</p>
    </form>
  </div>

  <div id="app">
    <header class="bar">
      <div class="brand"><img src="logo-ceremonia-beige.webp" alt=""><h1>Reservations</h1></div>
      <div style="display:flex;gap:8px">
        <button class="pill" id="refresh">Refresh</button>
        <button class="pill" id="logout">Sign out</button>
      </div>
    </header>

    <div id="req-box"></div>

    <div class="tabs">
      <button class="tab on" data-tab="day">Day by day</button>
      <button class="tab" data-tab="upcoming">Coming days</button>
      <button class="tab" data-tab="past">History</button>
    </div>

    <div id="dayhead" class="show">
      <div class="dh-l">
        <button class="arrow" id="prev">‹</button>
        <h2 id="day-title">Today</h2>
        <button class="arrow" id="next">›</button>
      </div>
      <div class="dh-l">
        <button class="pill" id="today-btn" style="padding:8px 16px">Today</button>
        <input type="date" id="day" title="Pick a date">
      </div>
    </div>
    <p id="summary"></p>
    <div id="main-list"></div>
  </div>

</div>
<datalist id="servers-dl"></datalist>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUSES=["pending","confirmed","seated","completed","cancelled","no_show"];
const LABEL={pending:"To answer",confirmed:"Confirmed",seated:"At the table",completed:"Closed",cancelled:"Cancelled",no_show:"No show"};
const ACTIVE=["pending","confirmed","seated"];
const LATE_MIN=15; /* grace period shown to guests on the booking form */
const isoLocal=d=>{const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())};
let tab="day", day=isoLocal(new Date());
const SERVERS=new Set();

function fmtDate(d){
  const today=isoLocal(new Date());
  const tomorrow=isoLocal(new Date(Date.now()+864e5));
  if(d===today)return "Today";
  if(d===tomorrow)return "Tomorrow";
  return new Date(d+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}

/* ── auth ── */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  $("login").style.display=session?"none":"block";
  $("app").style.display=session?"block":"none";
  if(session)load();
}
$("login-form").addEventListener("submit",async e=>{
  e.preventDefault();
  $("login-err").style.display="none";
  const {error}=await sb.auth.signInWithPassword({email:$("l-email").value.trim(),password:$("l-pass").value});
  if(error){$("login-err").style.display="block";return;}
  boot();
});
$("logout").addEventListener("click",async()=>{await sb.auth.signOut();boot();});

/* ── data ── */
function mainQuery(today){
  const t=sb.from("reservations").select("*");
  if(tab==="day")return t.eq("date",day).order("time_slot");
  if(tab==="upcoming")return t.gt("date",today).order("date").order("time_slot").limit(500);
  /* History: every finished reservation (closed, cancelled, no show), whatever the date, plus all past days */
  return t.or(`date.lt.${today},status.in.(completed,cancelled,no_show)`)
    .order("date",{ascending:false}).order("time_slot",{ascending:false}).limit(200); /* ponytail: last 200 only, add pagination if history grows */
}
async function load(){
  $("day").value=day;
  $("dayhead").classList.toggle("show",tab==="day");
  $("day-title").textContent=fmtDate(day);
  const today=isoLocal(new Date());
  const [pend,main]=await Promise.all([
    sb.from("reservations").select("*").eq("status","pending").gte("date",today).order("date").order("time_slot"),
    mainQuery(today)
  ]);
  if(pend.error||main.error){toast("Could not load, check the connection",true);return;}
  [...pend.data,...main.data].forEach(r=>{if(r.server_name)SERVERS.add(r.server_name)});
  $("servers-dl").innerHTML=[...SERVERS].sort().map(s=>`<option value="${esc(s)}">`).join("");
  renderRequests(pend.data,today);
  renderMain(main.data,today);
}

/* ── helpers ── */
function contact(r){
  const bits=[];
  if(r.phone){
    const wa=r.phone.replace(/[^0-9]/g,"");
    bits.push(`<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>`+(wa?` · <a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>`:""));
  }
  bits.push(`<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`);
  return bits.join(" · ");
}
function isLate(r,today){
  if(r.date!==today||(r.status!=="pending"&&r.status!=="confirmed"))return false;
  const [h,m]=r.time_slot.split(":").map(Number);
  const t=new Date();t.setHours(h,m+LATE_MIN,0,0);
  return new Date()>t;
}
function waConfirmLink(r){
  if(!r.phone)return "";
  const wa=r.phone.replace(/[^0-9]/g,"");
  if(!wa)return "";
  const txt=`Hello ${r.name}, your table at Ceremonia Rooftop Ubud is confirmed for ${fmtDate(r.date)} (${r.date}) at ${r.time_slot}, ${r.party_size} guests. Tables are held 15 minutes past the reservation time. See you soon under the Ubud sky!`;
  return `<a class="act wa" href="https://wa.me/${wa}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Send WhatsApp confirmation</a>`;
}
function conflictKeys(rows){
  const seen={},dup=new Set();
  rows.forEach(r=>{
    if(!r.table_assignment||!ACTIVE.includes(r.status))return;
    const k=r.date+"|"+r.time_slot+"|"+r.table_assignment.trim().toLowerCase();
    if(seen[k])dup.add(k);seen[k]=1;
  });
  return dup;
}
function assignFields(r,dup){
  const k=r.date+"|"+r.time_slot+"|"+(r.table_assignment||"").trim().toLowerCase();
  return `<div class="c-assign">
    <div class="af"><label>Table</label><input class="tbl${r.table_assignment&&dup.has(k)?" conflict":""}" data-f="table_assignment" data-id="${r.id}" value="${esc(r.table_assignment||"")}" maxlength="40" placeholder="e.g. 12"></div>
    <div class="af"><label>Server</label><input class="srv" data-f="server_name" data-id="${r.id}" list="servers-dl" value="${esc(r.server_name||"")}" maxlength="60" placeholder="name"></div>
  </div>`;
}
function cardTop(r,today,showDate){
  const late=isLate(r,today);
  return `<div class="c-top">
      <span class="time">${esc(r.time_slot)}</span>
      <span class="nm">${esc(r.name)}</span>
      <span class="pax">${r.party_size} guests</span>
      ${showDate?`<span class="when">${esc(fmtDate(r.date))}</span>`:""}
      ${late?'<span class="chip late">late 15+ min</span>':`<span class="chip ${esc(r.status)}">${LABEL[r.status]||esc(r.status)}</span>`}
    </div>
    <p class="c-ct">${contact(r)}</p>
    ${r.notes?`<p class="c-nt">"${esc(r.notes)}"</p>`:""}`;
}

/* ── requests banner ── */
function renderRequests(rows,today){
  const box=$("req-box");
  if(!rows.length){
    box.classList.add("quiet");
    box.innerHTML=`<h2>No new requests right now ✦</h2>`;
    return;
  }
  box.classList.remove("quiet");
  box.innerHTML=`<h2><span class="count-dot">${rows.length}</span> New request${rows.length>1?"s":""}</h2>
    <p class="sub">Guests are waiting for an answer. Accept, or refuse with a reason: the guest is notified by email automatically.</p>`
    +rows.map(r=>`
    <div class="card${isLate(r,today)?" late":""}">
      ${cardTop(r,today,true)}
      <div class="c-acts">
        <button class="act ok" data-do="confirmed" data-id="${r.id}">✓ Accept</button>
        <button class="act no" data-decl="${r.id}">✗ Refuse</button>
      </div>
      ${declineRow(r)}
    </div>`).join("");
}

/* ── main list ── */
function nextAction(r,today){
  if(r.status==="confirmed"){
    let h=`<button class="act main" data-do="seated" data-id="${r.id}">Guests are here</button>`;
    h+=waConfirmLink(r);
    if(isLate(r,today))h+=`<button class="act no" data-do="no_show" data-id="${r.id}">No show · free the table</button>`;
    return h;
  }
  if(r.status==="seated")return `<span style="font-size:10px;color:rgba(245,240,232,.35);letter-spacing:.06em">table frees automatically 2 hours after the booking time</span>`;
  if(r.status==="pending")return `<button class="act ok" data-do="confirmed" data-id="${r.id}">✓ Accept</button>
    <button class="act no" data-decl="${r.id}">✗ Refuse</button>`;
  return "";
}
function declineRow(r){
  return `<div class="fixrow" id="decl-${r.id}">
    <span>Reason sent to the guest</span>
    <button class="rbtn" data-dodecl="fully_booked" data-id="${r.id}">Fully booked</button>
    <button class="rbtn" data-dodecl="closed" data-id="${r.id}">Closed that day</button>
    <button class="rbtn" data-dodecl="group" data-id="${r.id}">Group too large</button>
    <button class="rbtn" data-dodecl="other" data-id="${r.id}">Other</button>
  </div>`;
}
async function decline(id,reason){
  let {error}=await sb.from("reservations").update({status:"cancelled",decline_reason:reason}).eq("id",id);
  /* fallback if the decline_reason migration has not been run yet */
  if(error&&/decline_reason/i.test(error.message||""))({error}=await sb.from("reservations").update({status:"cancelled"}).eq("id",id));
  toast(error?"Could not save, try again":"Refused. The guest is being notified by email",!!error);
  if(!error)load();
}
function card(r,today,dup,showDate){
  const inactive=r.status==="cancelled"||r.status==="no_show";
  const acts=nextAction(r,today);
  return `<div class="card${isLate(r,today)?" late":""}${inactive?" dim":""}" data-card="${r.id}">
    ${cardTop(r,today,showDate)}
    ${ACTIVE.includes(r.status)?assignFields(r,dup):""}
    <div class="c-acts">${acts}
      <button class="fixlink" data-fix="${r.id}">fix a mistake</button>
    </div>
    ${r.status==="pending"?declineRow(r):""}
    <div class="fixrow" id="fix-${r.id}">
      <span>Set status</span>
      <select class="st" data-id="${r.id}">
        ${STATUSES.map(s=>`<option value="${s}"${s===r.status?" selected":""}>${LABEL[s]}</option>`).join("")}
      </select>
    </div>
  </div>`;
}
function renderMain(rows,today){
  const dup=conflictKeys(rows);
  const active=rows.filter(r=>ACTIVE.includes(r.status));
  const covers=active.reduce((n,r)=>n+r.party_size,0);
  const seated=rows.filter(r=>r.status==="seated").length;
  let sum="";
  if(rows.length){
    if(tab==="past")sum=`${rows.length} finished reservations shown`;
    else sum=`<b>${active.length}</b> reservations · <b>${covers}</b> guests expected`+(seated?` · <b>${seated}</b> at the table now`:"");
  }
  $("summary").innerHTML=sum;
  if(!rows.length){
    $("main-list").innerHTML=`<p class="empty">${
      tab==="day"?"Nothing booked for this day.<br>New website requests always appear in the box above.":
      tab==="upcoming"?"No reservations on the coming days yet.":"No finished reservations yet. Closed, cancelled and no show reservations appear here."}</p>`;
    return;
  }
  let html="",lastDate=null;
  rows.forEach(r=>{
    if(tab!=="day"&&r.date!==lastDate){lastDate=r.date;html+=`<h3 class="datehdr">${esc(fmtDate(r.date))} · ${esc(r.date)}</h3>`;}
    html+=card(r,today,dup,false);
  });
  $("main-list").innerHTML=html;
  if(dup.size)toast("Careful: the same table is set twice on one time slot",true);
}

/* ── actions ── */
async function setField(id,patch,okMsg){
  const {error}=await sb.from("reservations").update(patch).eq("id",id);
  toast(error?"Could not save, try again":okMsg,!!error);
  if(!error)load();
}
document.addEventListener("click",e=>{
  const dcl=e.target.closest("[data-decl]");
  if(dcl){const b=dcl.closest(".card").querySelector('[id^="decl-"]');if(b)b.classList.toggle("show");return;}
  const dr=e.target.closest("[data-dodecl]");
  if(dr){decline(dr.dataset.id,dr.dataset.dodecl);return;}
  const doBtn=e.target.closest("[data-do]");
  if(doBtn){
    const msg={confirmed:"Accepted ✓ You can send the WhatsApp confirmation",cancelled:"Refused",seated:"Welcome! Marked at the table",no_show:"Marked no show, table is free"}[doBtn.dataset.do];
    setField(doBtn.dataset.id,{status:doBtn.dataset.do},msg||"Saved");return;
  }
  const fx=e.target.closest("[data-fix]");
  if(fx){$("fix-"+fx.dataset.fix).classList.toggle("show");return;}
  const t=e.target.closest(".tab");
  if(t){tab=t.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));load();}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.matches("select.st")){setField(el.dataset.id,{status:el.value},"Status changed");return;}
  if(el.dataset&&el.dataset.f){
    setField(el.dataset.id,{[el.dataset.f]:el.value.trim()||null},"Saved");return;
  }
  if(el.id==="day"){day=el.value;load();}
});
$("prev").addEventListener("click",()=>{const d=new Date(day);d.setDate(d.getDate()-1);day=isoLocal(d);load();});
$("next").addEventListener("click",()=>{const d=new Date(day);d.setDate(d.getDate()+1);day=isoLocal(d);load();});
$("today-btn").addEventListener("click",()=>{day=isoLocal(new Date());load();});
$("refresh").addEventListener("click",load);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&$("app").style.display==="block")load();});
/* gentle auto refresh during service, paused while typing in a field */
setInterval(()=>{
  if(document.hidden||$("app").style.display!=="block")return;
  const a=document.activeElement;
  if(a&&(a.tagName==="INPUT"||a.tagName==="SELECT"||a.tagName==="TEXTAREA"))return;
  if(document.querySelector(".fixrow.show"))return;
  load();
},60000);

let toastT;
function toast(m,warn){const t=$("toast");t.textContent=m;t.classList.toggle("warn",!!warn);t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2800);}

boot();
</script>
</body>
</html>
